- id: F037
  name: Préparer sol (déchaumer/labourer/herser)
  sprint: 10
  status: spec
  trigger:
    type: button
    label: '{action} ({ht} HT — {hvc}L)'
    page: /parcels/:id
    states:
      active: parcel_owned AND has_tractor AND has_tool AND ht_ok AND hvc_ok AND correct_sequence
      disabled:
      - condition: no tractor or broken
        tooltip: Tracteur fonctionnel requis
      - condition: no tool for action
        tooltip: '{tool} requis pour {action}'
      - condition: wrong sequence
        tooltip: Étape précédente non effectuée ({previous} requis)
      - condition: ht insufficient
        tooltip: HT insuffisants (besoin {ht_cost})
      - condition: hvc insufficient
        tooltip: Carburant HVC insuffisant (besoin {hvc_cost}L)
      - condition: technique=direct and action=prepare
        tooltip: Pas de préparation en semis direct
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/parcels/:id/prepare
    body: '{ type: stubble|plow|harrow, technique: traditional|tcs|direct }'
  - step: backend_idempotency_check
  - step: backend_validate_technique
    logic: 'traditional: stubble→plow→harrow. tcs: stubble→harrow (no plow). direct: skip all (semoir direct only).'
  - step: backend_transaction
    sql:
    - 'Check equipment: stubble→tractor+cultivateur|dechaumeur, plow→tractor+charrue, harrow→tractor+herse_rotative'
    - FOR UPDATE player + hvc
    - UPDATE parcel status
    - UPDATE player ht, UPDATE inventory hvc
    - UPDATE vehicle wear
    - 'Roll panne chance: if wear > 80% → 15% chance is_broken=true'
  - step: frontend_toast
    message: 🚜 {action} effectué ! Parcelle prête pour l'étape suivante.
  depends_on:
  - F035
  tests:
  - GIVEN fallow + tractor + cultivateur WHEN stubble THEN status=stubbled
  - GIVEN stubbled + tractor + charrue WHEN plow (traditional) THEN status=plowed
  - GIVEN plowed + tractor + herse_rotative WHEN harrow THEN status=harrowed
  - GIVEN technique=tcs WHEN plow THEN 400 pas de labour en TCS
  - GIVEN technique=direct WHEN stubble THEN 400 pas de préparation en semis direct
  requires:
  - parcel
  - vehicle:tractor
  - vehicle:cultivateur|dechaumeur (stubble)
  - vehicle:charrue (plow, traditional only)
  - vehicle:herse_rotative (harrow)
  - fuel:hvc
