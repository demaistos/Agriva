    method: POST
    route: /api/parcels/:id/defane
    body: '{ method: ''mechanical''|''chemical'' }'
  - step: backend_transaction
    sql:
    - 'mechanical: requires broyeur, no product consumed'
    - 'chemical: requires pulverisateur + 2.5L désherbant défanage/ha, CHECK no wind'
    - UPDATE crop SET defaned=true, defane_method=$method
    - UPDATE player ht, vehicle wear, inventory hvc
    - 'If chemical: UPDATE inventory desherbant -= 2.5 × ha'
