- id: F041
  name: Récolter
  sprint: 11
  status: spec
  trigger:
    type: button
    label: Récolter
    page: /parcels/:id
    states:
      active: crop.status='mature' AND has_harvest_machine AND ht_ok AND hvc_ok
      disabled:
      - condition: crop not mature
        tooltip: Culture pas encore mature ({growth}%)
      - condition: crop over-mature
        tooltip: ⚠️ Culture sur-mature depuis {days}j — rendement réduit de {penalty}%
      - condition: no harvest machine
        tooltip: '{machine} requise pour {crop}'
      - condition: no benne or broken
        tooltip: Benne fonctionnelle requise
      - condition: ht insufficient
        tooltip: HT insuffisants (besoin {ht_cost})
      - condition: hvc insufficient
        tooltip: Carburant HVC insuffisant (besoin {hvc_cost}L)
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/parcels/:id/harvest
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - 'Select harvest machine by crop: cereals/colza/tournesol/pois/mais_grain→moissonneuse, mais_ensile/sorgho→ensileuse,
      betterave→arracheuse_betterave'
    - Calculate yield (9 factors + soil health bonus)
    - 'Soil health bonus: welfare_factor from soil_health_index (0-19=×0.90, 20-49=×1.00, 50-79=×1.10, 80-100=×1.25)'
    - 'Over-maturity penalty: if days_since_mature > 7 then yield × (1 - 0.02 × (days - 7)), min 0.50'
    - Store in silo (capped)
    - Auto-sell excess
    - 'If crop.produces_straw: INSERT straw_on_field (paille au sol)'
    - DELETE crop, UPDATE parcel status=fallow
    - UPDATE parcel fatigue_index (+5 rotation, +15 monoculture)
    - UPDATE player, vehicle, inventory
    - UPDATE vehicle SET wear += usage_wear WHERE id IN (used_vehicle_ids)
    - 'Roll panne chance: if wear > 80% → 15% chance is_broken=true'
  - step: frontend_toast
    message: 🌾 {total}t récoltées ! {stored}t stockées, {excess}t vendues
  depends_on:
  - F038
  tests:
  - GIVEN mature wheat, silo 8t free WHEN harvest 82t THEN 8t stored 74t sold
  - GIVEN mature wheat WHEN harvest THEN straw_on_field created (8t/ha)
  - GIVEN mature corn_silage, no ensileuse THEN 400 ensileuse requise
  - GIVEN mature sugar_beet, no arracheuse THEN 400 arracheuse requise
  - GIVEN monoculture wheat ×2 THEN fatigue_index += 15
  - GIVEN rotation wheat→colza THEN fatigue_index += 5
  requires:
  - parcel
  - vehicle:moissonneuse (céréales, colza, tournesol, pois, maïs grain)
  - vehicle:ensileuse (maïs ensilé, sorgho ensilé)
  - vehicle:arracheuse_betterave (betterave)
  - vehicle:benne
  - fuel:hvc
- id: F042
  name: Vendre récolte
  sprint: 11
  status: spec
  trigger:
    type: button
    label: Vendre {total} €
    page: /market/sell
    states:
      active: stock_recolte > 0 AND has_tractor AND has_benne AND ht_ok AND hvc_ok
      disabled:
      - condition: no stock
        tooltip: Aucune récolte en stock
      - condition: no tractor or broken
        tooltip: Tracteur fonctionnel requis
      - condition: no benne or broken
        tooltip: Benne fonctionnelle requise
      - condition: ht insufficient
        tooltip: HT insuffisants (besoin {ht_cost})
      - condition: hvc insufficient
        tooltip: Carburant HVC insuffisant (besoin {hvc_cost}L)
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/market/sell
    body: '{ product_type, quantity, quality: 1|2|3 }'
  - step: backend_idempotency_check
  - step: backend_calculate_price
    logic: price_per_ton = base_price × quality_factor(1=0.85, 2=1.00, 3=1.10) × season_factor(harvest_season=0.90, other=1.10)
  - step: backend_calculate_transport
    logic: distance_km = haversine(coop_prefecture, player_prefecture), transport_cost = distance_km × 0.30, hvc_cost = distance_km
      × 0.20, ht_transport = distance_km / 100
  - step: backend_transaction
    sql:
    - SELECT balance, ht_today FROM player FOR UPDATE
    - SELECT quantity FROM inventory WHERE product=$product AND quality=$quality FOR UPDATE
    - SELECT id, wear FROM vehicle WHERE type=tractor AND NOT is_broken FOR UPDATE
    - SELECT id, wear FROM vehicle WHERE type=benne AND NOT is_broken FOR UPDATE
    - SELECT quantity FROM inventory WHERE product=hvc FOR UPDATE
    - CHECK stock >= quantity AND ht >= ht_cost AND hvc >= hvc_cost
    - UPDATE inventory SET quantity -= sold_quantity WHERE product=$product
    - UPDATE player SET balance += (prix_total - transport_cost), ht_today -= ht_cost
    - UPDATE inventory SET quantity -= hvc_cost WHERE product=hvc
    - UPDATE vehicle SET wear += usage_wear WHERE id IN (tractor_id, benne_id)
    - 'Roll panne chance: if wear > 80% then 15% chance is_broken=true'
    - INSERT INTO ledger (category=sale)
    - INSERT INTO ledger (category=transport)
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
    - stock_update
  - step: frontend_toast
    message: 💰 {quantity}t {product} Q{quality} vendus ! +{prix}€ (transport -{transport_cost}€)
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F041
  tests:
  - GIVEN tractor, benne, 50km, 100t wheat Q2, hvc WHEN sell THEN balance += prix - transport
  - GIVEN wheat Q3 sold in winter THEN price = base × 1.10 × 1.10
  - GIVEN wheat Q1 sold in summer THEN price = base × 0.85 × 0.90
  - GIVEN no benne THEN 400 benne requise
  - GIVEN tractor broken THEN 400 tracteur en panne
  - GIVEN hvc=0 THEN 400 carburant insuffisant
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - stock:recolte
  - vehicle:tractor
  - vehicle:benne
  - fuel:hvc
