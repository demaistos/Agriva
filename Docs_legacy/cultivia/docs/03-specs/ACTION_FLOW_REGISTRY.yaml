flows:
# NOTE: trigger.step = identifiant logique, PAS ordre exécution. Voir GAME_SYSTEMS §1.4 pour l ordre réel du tick.
- id: F001
  name: Construire un bâtiment
  sprint: 3
  status: spec
  trigger:
    type: button
    label: Construire {prix} €
    page: /buildings/buy
    states:
      active: balance >= prix AND ht >= 2.0
      disabled:
      - condition: balance < prix
        tooltip: Solde insuffisant (besoin {prix}€, reste {balance}€)
      - condition: ht < 2.0
        tooltip: HT insuffisants (besoin 2.0, reste {ht})
  chain:
  - step: frontend_validate
    checks:
    - size > 0
    - balance >= cost
    - ht >= 2.0
  - step: generate_idempotency_key
  - step: disable_button_spinner
  - step: api_call
    method: POST
    route: /api/buildings
    headers:
    - Authorization
    - X-Idempotency-Key
    body: '{ building_type_id: int, size: number, name: string }'
  - step: backend_idempotency_check
  - step: backend_auth_jwt
  - step: backend_load_building_type
  - step: backend_calculate_cost
    formula: size × base_cost_per_unit
  - step: backend_transaction
    sql:
    - SELECT balance, ht_today FROM player WHERE id=$1 FOR UPDATE
    - CHECK balance >= cost AND ht_today >= 2.0
    - UPDATE player SET balance = balance - $cost, ht_today = ht_today - 2.0
    - INSERT INTO building (...) RETURNING id
    - INSERT INTO building_animal_capacity (if housing type)
    - INSERT INTO ledger (category='purchase')
  - step: backend_cache_idempotency
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
    - building_alert
  - step: frontend_toast
    message: 🏗️ {type} construit ! ({size} {unit})
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  - step: frontend_redirect
    to: /buildings
  depends_on: []
  tests:
  - GIVEN 100k€ 40HT WHEN build stabulation 20 THEN balance=96k ht=38
  - GIVEN 0HT WHEN build THEN 400 HT insuffisants
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - kit:eleveur|cultivateur|polyvalent
- id: F002
  name: Acheter un animal au Marché Central
  sprint: 3
  status: spec
  trigger:
    type: button
    label: Acheter {prix} €
    page: /market/animals
    states:
      active: balance >= total_cost AND ht >= ht_cost AND building_has_space AND has_trailer AND has_tractor AND hvc >= hvc_cost
      disabled:
      - condition: balance < total_cost
        tooltip: Solde insuffisant ({total_cost} € = {prix} € + {transport_cost} € transport)
      - condition: ht < ht_cost
        tooltip: HT insuffisants (besoin {ht_cost}, reste {ht})
      - condition: no building with space
        tooltip: Aucun bâtiment avec place disponible
      - condition: no tractor or broken
        tooltip: Tracteur fonctionnel requis
      - condition: no trailer or broken
        tooltip: Bétaillère fonctionnelle requise (bovins/ovins/caprins/porcins)
      - condition: no utilitaire or broken
        tooltip: Utilitaire fonctionnel requis (volailles/pintades/lapins)
      - condition: no van or broken
        tooltip: Van fonctionnel requis (chevaux)
      - condition: hvc < hvc_cost
        tooltip: Carburant HVC insuffisant (besoin {hvc_cost}L)
      - condition: daily_purchase_limit_reached
        tooltip: Limite atteinte (max 5 animaux de cette espèce par jour au Marché Central)
  chain:
  - step: frontend_validate
    checks:
    - building_has_space
    - balance >= total_cost
    - ht >= ht_cost
    - has_tractor
    - has_trailer
    - hvc >= hvc_cost
  - step: generate_idempotency_key
  - step: disable_button_spinner
  - step: api_call
    method: POST
    route: /api/animals/buy
    body: '{ breed_id: int, life_stage: string, sex: string, building_id: uuid }'
  - step: backend_calculate_transport
    logic: distance_km = haversine(market_prefecture, player_prefecture), transport_cost = distance_km × 0.50, hvc_cost =
      distance_km × 0.15, ht_cost = 0.5 + (distance_km / 100), wear_increase = distance_km × 0.02
  - step: backend_idempotency_check
  - step: backend_auth_jwt
  - step: backend_transaction
    sql:
    - SELECT balance, ht_today FROM player FOR UPDATE
    - SELECT animal_count, max_capacity FROM building_animal_capacity FOR UPDATE
    - SELECT id, wear FROM vehicle WHERE type='tractor' AND NOT is_broken FOR UPDATE
    - SELECT id, wear FROM vehicle WHERE type='trailer' AND NOT is_broken FOR UPDATE
    - SELECT quantity FROM inventory WHERE product='hvc' FOR UPDATE
    - CHECK balance >= price + transport_cost AND ht >= ht_cost AND count < capacity AND hvc >= hvc_cost
    - UPDATE player SET balance -= (price + transport_cost), ht_today -= ht_cost
    - UPDATE inventory SET quantity -= hvc_cost WHERE product='hvc'
    - UPDATE vehicle SET wear += wear_increase WHERE id IN (tractor_id, trailer_id)
    - 'Roll panne chance: if wear > 80% → 15% chance is_broken=true'
    - INSERT INTO animal (...) with random genetics, status='in_transit', arrival_at=NOW()+interval(distance_km/50||'h')
    - UPDATE building_animal_capacity SET animal_count += 1
    - INSERT INTO ledger (category='purchase')
    - INSERT INTO ledger (category='transport')
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
    - animal_alert
  - step: frontend_toast
    message: 🐄 {breed} achetée ! Transport {distance}km — arrivée dans {delay}
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F001
  tests:
  - GIVEN stabulation 0/20, tractor, trailer, 100km, 50L hvc WHEN buy THEN animal in_transit, balance -= price+50€, ht -=
    1.5, hvc -= 15L, wear += 2%
  - GIVEN stabulation 20/20 WHEN buy THEN 400 pas de place
  - GIVEN no trailer WHEN buy THEN 400 bétaillère requise
  - GIVEN no tractor WHEN buy THEN 400 tracteur requis
  - GIVEN hvc=0 WHEN buy THEN 400 carburant insuffisant
  - GIVEN trailer wear=90% WHEN buy THEN wear increases + panne possible
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - vehicle:tractor (bovins/ovins/caprins/porcins/bisons/daims)
  - vehicle:trailer (bovins/ovins/caprins/porcins/bisons/daims)
  - vehicle:utilitaire (volailles/pintades/lapins/oies/canards)
  - vehicle:van (chevaux, tracté par utilitaire)
  - fuel:hvc
  - building:adapté_espèce (stabulation/bergerie/chèvrerie/porcherie/poulailler/clapier/écurie)
  note: Le véhicule requis dépend de l'espèce. Bétaillère pour gros animaux, utilitaire pour petits, van pour chevaux.
- id: F003
  name: Voir liste animaux (+ lots + génétique)
  sprint: 3
  status: spec
  trigger:
    type: navigation
    page: /animals
  chain:
  - step: api_call
    method: GET
    route: /api/animals?species=cattle&page=1&limit=20
  - step: api_call
    method: GET
    route: /api/animals/dashboard
  - step: frontend_render
    components:
    - DashboardElevage
    - DataTable
    - Filters
  depends_on:
  - F002
  tests:
  - GIVEN player with 5 animals WHEN GET /api/animals THEN list with 5 entries + dashboard stats
  - GIVEN player with 0 animals WHEN GET THEN empty list + message 'Achetez votre premier animal'
  requires:
  - animal:any
- id: F004
  name: Consulter fiche animal
  sprint: 3
  status: spec
  trigger:
    type: button
    label: '[Voir]'
    page: /animals (DataTable row)
    states:
      active: animal_exists AND owned
      disabled:
      - condition: animal dead
        tooltip: Animal mort — fiche en lecture seule
  chain:
  - step: frontend_navigate
    to: /animals/:id
  - step: api_call
    method: GET
    route: /api/animals/:id
    response_includes:
    - identity
    - genetics
    - health
    - feeding
    - production
    - reproduction
    - parents
    - available_actions
  - step: frontend_render
    components:
    - AnimalIdentity
    - GeneticBars
    - HealthPanel
    - FeedingPanel
    - ProductionPanel
    - ReproductionPanel
    - ActionButtons
    conditional_sections:
      dairy:
      - MilkProduction
      - MilkButton
      beef:
      - CarcassClassification
      poultry:
      - EggProduction
      sheep:
      - WoolProduction
      - ShearButton
  depends_on:
  - F002
  tests:
  - GIVEN animal exists WHEN GET THEN full data with available_actions
  - GIVEN animal not owned THEN 403
  requires:
  - animal:any
- id: F005
  name: Renommer un animal
  sprint: 3
  status: spec
  trigger:
    type: inline_edit
    label: ✏️ (clic sur nom)
    page: /animals/:id
    states:
      active: animal_exists AND owned AND NOT dead
      disabled:
      - condition: animal dead
        tooltip: Animal mort — renommage impossible
      - condition: name too long
        tooltip: 30 caractères maximum
      - condition: invalid characters
        tooltip: Caractères spéciaux non autorisés
  chain:
  - step: frontend_inline_input
    validation: 1-30 chars, /^[a-zA-ZÀ-ÿ0-9 '-]+$/
  - step: api_call
    method: PUT
    route: /api/animals/:id
    body: '{ name: string }'
  - step: backend_validate_and_update
    sql: UPDATE animal SET name=$name, is_named=true WHERE id=$1
  - step: frontend_feedback
    type: inline_checkmark
  depends_on:
  - F004
  tests:
  - GIVEN owned animal WHEN rename 'Marguerite' THEN name updated, is_named=true
  - GIVEN animal not owned THEN 403
  - GIVEN name > 30 chars THEN 400 nom trop long
  - GIVEN name with <script> THEN 400 caractères invalides
  requires:
  - animal:any
- id: F006
  name: Acheter aliments au Marché Central
  sprint: 4
  status: spec
  trigger:
    type: button
    label: Acheter {total} €
    page: /market/products
    states:
      active: balance >= total AND ht >= 0.5 AND silo_has_space
      disabled:
      - condition: no silo
        tooltip: Pas de silo — construisez-en un
      - condition: silo full
        tooltip: Silo plein ({current}/{capacity}t)
      - condition: no tractor or broken
        tooltip: Tracteur fonctionnel requis
      - condition: no benne or broken
        tooltip: Benne fonctionnelle requise
      - condition: hvc < hvc_cost
        tooltip: Carburant HVC insuffisant
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/market/buy
    body: '{ product: string, quantity: number, building_id: uuid }'
  - step: backend_idempotency_check
  - step: backend_calculate_transport
    logic: distance_km = haversine(market_prefecture, player_prefecture), transport_cost = distance_km × 0.30, hvc_cost =
      distance_km × 0.20, ht_transport = distance_km / 100
  - step: backend_transaction
    sql:
    - SELECT balance, ht_today FROM player FOR UPDATE
    - SELECT quantity, capacity FROM inventory FOR UPDATE
    - CHECK balance >= total AND stock + qty <= capacity
    - UPDATE player, UPDATE inventory, INSERT ledger
    - UPDATE vehicle SET wear += usage_wear WHERE id IN (used_vehicle_ids)
    - 'Roll panne chance: if wear > 80% → 15% chance is_broken=true'
    - UPDATE inventory SET quantity -= hvc_cost WHERE product='hvc'
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
  - step: frontend_toast
    message: 🌾 {qty}t de {product} achetées pour {total}€
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F001
  tests:
  - GIVEN silo 10t empty WHEN buy 2t hay THEN silo=2t balance-=160
  - GIVEN same idempotency key ×2 THEN no double deduction
  - GIVEN tractor, benne, 80km, hvc WHEN buy THEN stock delivered, wear += usage, hvc -= cost
  requires:
  - building:silo
  - vehicle:tractor
  - vehicle:benne
  - fuel:hvc
- id: F007
  name: Remplir cuve à eau
  sprint: 4
  status: spec
  trigger:
    type: button
    label: Remplir {total} €
    page: /buildings/:id (cuve eau)
    states:
      active: cuve_not_full AND balance >= cost AND ht >= 0.5
      disabled:
      - condition: cuve full
        tooltip: Cuve déjà pleine
      - condition: balance < cost
        tooltip: Solde insuffisant (besoin {cost}€)
      - condition: ht < 0.5
        tooltip: HT insuffisants
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/market/buy
    body: '{ product: ''water'', quantity: number, building_id: uuid }'
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - same pattern as F006
    - INSERT INTO ledger (category='purchase')
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
  - step: frontend_toast
    message: 💧 Cuve remplie ({qty}L) — {cost}€
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F001
  tests:
  - GIVEN cuve 0/5000L WHEN fill 3000L THEN cuve=3000L, balance -= cost
  - GIVEN cuve 5000/5000L WHEN fill THEN 400 cuve déjà pleine
  - GIVEN balance < cost WHEN fill THEN 400 solde insuffisant
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - infra:cuve_eau
- id: F008
  name: Nourrir animaux (manuel)
  sprint: 4
  status: spec
  trigger:
    type: button
    label: Nourrir 🍽️
    page: /buildings/:id/feed
    states:
      active: ration_selected AND stock_ok AND ht >= cost AND not_already_fed
      disabled:
      - condition: no ration selected
        tooltip: Sélectionnez une ration
      - condition: stock insufficient
        tooltip: 'Stock insuffisant : manque {X}kg de {product}'
      - condition: ht < cost
        tooltip: HT insuffisants (besoin {X}, reste {Y})
      - condition: already fed
        tooltip: Animaux déjà nourris aujourd'hui
      - condition: desilage without equipment
        tooltip: Désileuse requise (tracteur + désileuse)
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/buildings/:id/feed
    body: '{ ration_id: int, method: ''manual''|''desilage'' }'
  - step: backend_idempotency_check
  - step: backend_calculate_ht
    logic: 'manual: ht_cost = 1.0 + (animal_count × ht_per_animal), desilage: ht_cost = 0.5 + (animal_count × ht_per_animal
      × 0.4). ht_per_animal: bovins/chevaux/bisons=0.05, ovins/caprins/porcins=0.03, volailles/pintades/lapins=0.01. Desilage
      requires tractor + desileuse.'
  - step: backend_transaction
    sql:
    - SELECT ht_today FROM player FOR UPDATE
    - 'For each ration component: SELECT quantity FROM inventory FOR UPDATE'
    - 'If method=desilage: SELECT id, wear FROM vehicle WHERE type IN (''tractor'',''desileuse'') AND NOT is_broken FOR UPDATE'
    - CHECK all stocks sufficient AND ht >= ht_cost
    - UPDATE player SET ht -= ht_cost
    - UPDATE inventory SET quantity -= need (per component)
    - UPDATE animal SET last_fed_at=NOW(), days_unfed=0, feeding_quality=ration.quality
    - 'If method=desilage: UPDATE vehicle SET wear += 0.5 WHERE id IN (tractor_id, desileuse_id)'
    - 'If method=desilage: Roll panne chance: if wear > 80% → 15% chance is_broken=true'
    - INSERT INTO animal_feeding_log (ration_id, quality, method)
  - step: backend_emit_ws
    events:
    - ht_update
    - animal_alert
  - step: frontend_toast
    message: 🍽️ {N} animaux nourris — Ration {name} ★{quality}
  - step: frontend_update_icons
    target: 'DataTable animal rows: 🍽️❌ → 🍽️✅'
  depends_on:
  - F002
  - F006
  tests:
  - GIVEN 1 animal unfed, 2t hay WHEN feed manual THEN fed, stock -= 25kg, ht -= 1.05
  - GIVEN 1 animal unfed, 2t hay, tractor, desileuse WHEN feed desilage THEN fed, stock -= 25kg, ht -= 0.52
  - GIVEN 0 stock WHEN feed THEN 400 stock insuffisant
  - GIVEN already fed WHEN feed THEN 400 déjà nourris
  - GIVEN desilage without tractor WHEN feed THEN 400 tracteur requis
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
  - stock:aliments
  - building:stabulation
- id: F009
  name: Abreuver animaux
  sprint: 4
  status: spec
  trigger:
    type: button
    label: Abreuver 💧
    page: /buildings/:id (or batch)
    states:
      active: water_available AND ht >= 0.3 AND not_already_watered
      disabled:
      - condition: no water tank
        tooltip: Pas de cuve à eau
      - condition: tank empty
        tooltip: Cuve vide
      - condition: already watered
        tooltip: Déjà abreuvés aujourd'hui
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/buildings/:id/water
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - SELECT ht FROM player FOR UPDATE
    - SELECT quantity FROM inventory WHERE product='water' FOR UPDATE
    - UPDATE player, inventory, animal SET last_watered_at=NOW()
  - step: backend_emit_ws
    events:
    - ht_update
    - animal_alert
  - step: frontend_toast
    message: 💧 {N} animaux abreuvés ({water}L)
  depends_on:
  - F007
  - F002
  tests:
  - GIVEN cuve 5000L, 1 animal WHEN water THEN cuve -= 45L
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
  - infra:cuve_eau
- id: F010
  name: Configurer nourrissage automatique
  sprint: 4
  status: spec
  trigger:
    type: button
    label: Activer nourrissage auto ⚙️
    page: /buildings/:id/auto-feed
    states:
      active: ration_selected AND stock_15d_ok AND not_already_active
      disabled:
      - condition: no ration selected
        tooltip: Sélectionnez une ration d'abord
      - condition: stock < 15 days
        tooltip: Stock insuffisant pour 15 jours (assez pour {days}j)
      - condition: already active
        tooltip: Nourrissage auto déjà actif ({days}j restants)
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/buildings/:id/auto-feed
    body: '{ ration_id: int, method: string }'
  - step: backend_idempotency_check
  - step: backend_upsert
    sql: UPSERT auto_feed_config
  - step: frontend_toast
    message: ⚙️ Nourrissage auto activé — ~{days}j de stock
  depends_on:
  - F008
  tests:
  - GIVEN config active, tick runs THEN animals fed, stock deducted
  - GIVEN config active, stock=0 THEN skip + notification
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
  - stock:aliments
- id: F011
  name: Tick santé — animaux non nourris tombent malades
  sprint: 4
  status: spec
  trigger:
    type: worker_tick
    step: 12
  chain:
  - step: worker_query
    sql: SELECT * FROM animal WHERE last_fed_at < CURRENT_DATE - 1
  - step: worker_update
    logic: 'days_unfed += 1, health -= 10, if days_unfed >= 3: is_sick=true, if health <= 0: dead. Sick animals: weight_gain=0,
      milk_production=0, males cannot inseminate.'
  - step: worker_notify
    events:
    - 🍽️ {N} animaux pas nourris
    - 🏥 {N} malades
    - 💀 {N} morts
  depends_on:
  - F008
  tests:
  - GIVEN unfed 3 days THEN is_sick=true
  - GIVEN health=5 unfed THEN dead
  - GIVEN sick cow THEN milk_production=0 weight_gain=0
  - GIVEN sick male THEN cannot inseminate
  requires:
  - animal:any
- id: F012
  name: Soigner un animal
  sprint: 5
  status: spec
  trigger:
    type: button
    label: Soigner {cost} €
    page: /animals/:id
    states:
      active: is_sick AND balance >= cost AND ht >= 0.5
      disabled:
      - condition: not sick
        tooltip: Pas malade
      - condition: balance < cost
        tooltip: Solde insuffisant
      - condition: ht < 0.5
        tooltip: HT insuffisants
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/animals/:id/heal
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - FOR UPDATE player
    - UPDATE player balance-=cost ht-=0.5
    - UPDATE animal is_healing=true, healing_until=NOW()+3d, health+=10
    - INSERT health_log
    - INSERT ledger
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
    - animal_alert
  - step: frontend_toast
    message: 🩺 {name} en soins ! Guérison dans ~3j
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F011
  tests:
  - GIVEN sick WHEN heal THEN is_healing=true, healing_until=+3d, balance-=100
  - GIVEN not sick THEN 400
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
- id: F013
  name: Soigner tous (batch)
  sprint: 5
  status: spec
  trigger:
    type: button
    label: Soigner tous
    page: /animals (dashboard)
    states:
      active: sick_count > 0 AND balance >= total_cost AND ht >= total_ht
      disabled:
      - condition: no sick animals
        tooltip: Aucun animal malade
      - condition: balance < total_cost
        tooltip: Solde insuffisant (besoin {total_cost}€)
      - condition: ht < total_ht
        tooltip: HT insuffisants (besoin {total_ht})
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/animals/batch-heal
    body: '{ animal_ids: [] }'
  - step: backend_idempotency_check
  - step: backend_transaction
    sql: same as F012 in loop, single transaction
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
    - animal_alert
  - step: frontend_toast
    message: 🩺 {N} animaux soignés ! -{total}€
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F012
  tests:
  - GIVEN 3 sick WHEN batch-heal THEN all healthy, balance -= sum(costs)
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
- id: F014
  name: Vacciner un animal
  sprint: 5
  status: spec
  trigger:
    type: button
    label: Vacciner {cost} €
    page: /animals/:id
    states:
      active: vaccinated_until < now AND balance >= 50 AND ht >= 0.5
      disabled:
      - condition: already vaccinated
        tooltip: Déjà vacciné (expire dans {X}j)
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/animals/:id/vaccinate
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - FOR UPDATE player
    - UPDATE player balance-=50 ht-=0.5
    - UPDATE animal vaccinated_until=now+84d
    - INSERT health_log, ledger
  - step: frontend_toast
    message: 💉 {name} vacciné ! Protection 1 an (84j)
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F004
  tests:
  - GIVEN unvaccinated WHEN vaccinate THEN protected 84d (1 an Cultivia)
  - GIVEN vaccinated 5d ago THEN 400
  - GIVEN same idempotency key ×2 THEN no double deduction
  requires:
  - animal:any
- id: F015
  name: Mettre de la paille
  sprint: 5
  status: spec
  trigger:
    type: button
    label: Mettre paille 🛏️
    page: /buildings/:id
    states:
