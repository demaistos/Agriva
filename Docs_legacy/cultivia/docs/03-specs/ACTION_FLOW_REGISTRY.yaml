- id: F035
  name: Acheter une parcelle
  sprint: 10
  status: spec
  trigger:
    type: button
    label: Acheter {prix} €
    page: /parcels/buy
    states:
      active: balance >= prix AND ht >= 2.0 AND parcelle_disponible
      disabled:
      - condition: balance < prix
        tooltip: Solde insuffisant (besoin {prix}€)
      - condition: ht < 2.0
        tooltip: HT insuffisants (besoin 2.0)
      - condition: parcelle déjà vendue
        tooltip: Cette parcelle a été achetée par un autre joueur
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/parcels/buy
    body: '{ parcel_listing_id: int }'
  - step: backend_idempotency_check
  - step: backend_transaction
    sql:
    - SELECT * FROM parcel_listing WHERE id=$1 AND status='available' FOR UPDATE
    - CHECK listing exists AND not sold
    - UPDATE parcel_listing SET status='sold', buyer_id=$player_id
    - INSERT INTO parcel (player_id, prefecture_id, type, size_ha, soil_quality)
    - INSERT INTO soil_analysis (parcel_id, fertilite, structure, oligo, ph, matiere_org)
    - UPDATE player SET balance -= prix, ht -= 2.0
    - INSERT INTO transaction (ledger)
  - step: backend_emit_ws
    events:
    - balance_update
    - ht_update
  - step: frontend_toast
    message: 🌾 Parcelle achetée ! {ha}ha à {prefecture} — Qualité ⭐{quality}
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on: []
  tests:
  - GIVEN parcelle dispo, balance OK WHEN buy THEN parcel created, listing sold
  - GIVEN parcelle déjà vendue THEN 400 "Déjà achetée"
  - GIVEN 2 joueurs achètent même parcelle simultanément THEN FOR UPDATE, 1 seul gagne
  - GIVEN same idempotency key ×2 THEN no double achat
  requires: []
  note: |
    SYSTÈME DE GÉNÉRATION PARCELLES :
    - Chaque 1er du mois Cultivia, le serveur génère des parcelles à vendre par ville.
    - Nombre = nb_joueurs_dans_la_ville × 10.
    - Chaque parcelle a : type (culture/pré), taille (5-30ha aléatoire), qualité sol (aléatoire), prix/ha (fixe par préfecture).
    - Les parcelles sont visibles par TOUS les joueurs (pas juste ceux de la ville).
    - Un joueur peut acheter dans N'IMPORTE QUELLE ville (mais transport plus cher si loin).
    - Le dernier jour du mois : la limite de stock tombe, les parcelles invendues sont accessibles sans restriction.
    - Les parcelles non vendues à la fin du mois disparaissent (nouveau stock le mois suivant).
