  - GIVEN pdt 85%, broyeur WHEN defane mechanical THEN defaned
  - GIVEN pdt 85%, pulverisateur, desherbant, no wind WHEN defane chemical THEN defaned
  - GIVEN wind active WHEN defane chemical THEN 400 vent trop fort
  - GIVEN pdt 60% THEN 400 trop tôt
  requires:
