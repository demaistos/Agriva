    logic: 'Qualité Lait (QL) = moyenne(genetics.milk_index, feeding_quality). QL 50=×1.0, QL 80=×1.15, QL 20=×0.85. factor = 0.85 + (QL/100) × 0.30. price = base_price × factor × quantity'
