    - UPDATE building manure += straw_used × 1.2 (paille→fumier ratio)
    - UPDATE player ht-=cost
    - 'If method=pailleuse: UPDATE vehicle SET wear += 0.5 WHERE id IN (tractor_id, pailleuse_id)'
