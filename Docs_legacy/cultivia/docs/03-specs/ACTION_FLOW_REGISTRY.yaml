  - GIVEN 1 employee, balance 500€ WHEN tick THEN employee fired
  - GIVEN loan 50k€ 3% 48m WHEN tick THEN monthly payment debited
  - GIVEN 3 buildings, summer WHEN tick THEN energy bill debited
  - GIVEN 50ha, CA 10k€ WHEN tick THEN tax 250€ + MSA 500€ debited
