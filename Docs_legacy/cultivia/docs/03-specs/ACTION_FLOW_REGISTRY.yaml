  - GIVEN stabulation litiere, 10 cows THEN manure += 720kg, bedding_quality -= 10
  - GIVEN bedding_quality=0 THEN animals risk_sick notification
  - GIVEN caillebotis, 10 cows THEN lisier += 2000L
