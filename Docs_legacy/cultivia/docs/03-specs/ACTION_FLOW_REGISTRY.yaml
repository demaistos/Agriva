  - F035
  tests:
  - GIVEN parcel pH 5.5 WHEN lime THEN pH += correction
  - GIVEN recently limed THEN 400
  requires:
  - parcel
  - vehicle:tractor
  - vehicle:epandeur_engrais
  - fuel:hvc
- id: F130
  name: Clôturer un pré
  sprint: 14
  status: spec
  trigger:
    type: button
    label: Clôturer {cost} €
    page: /parcels/:id (pré)
    states:
      active: parcel.type='pre' AND NOT fenced AND balance >= cost AND ht >= 1.0
      disabled:
      - condition: already fenced
        tooltip: Pré déjà clôturé
      - condition: not a pre
        tooltip: Seuls les prés peuvent être clôturés
  chain:
  - step: generate_idempotency_key
  - step: backend_transaction
    sql:
    - UPDATE parcel SET is_fenced=true
    - UPDATE player balance -= cost, ht -= 1.0
    - INSERT ledger
  - step: frontend_toast
    message: 🏗️ Pré clôturé — prêt à accueillir des animaux
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F035
  tests:
  - GIVEN unfenced pre WHEN fence THEN is_fenced=true
  requires:
  - parcel:pre
- id: F131
  name: Voir plan de ferme
  sprint: 15
  status: spec
  trigger:
    type: navigation
    page: /farm/map
  chain:
  - step: api_call
    method: GET
    route: /api/farm/map
  - step: frontend_render
    components:
    - FarmMap (bâtiments positionnés, parcelles avec état, véhicules)
  depends_on: []
  tests:
  - GIVEN player with buildings+parcels WHEN GET THEN map rendered
  requires: []
- id: F132
  name: Relevage avant (combiné double outil)
  sprint: 14
  status: spec
  trigger:
    type: button
    label: Atteler avant {outil}
    page: /equipment/:id (tracteur >= 50CV)
    states:
      active: tractor.power >= 50 AND has_relevage_avant AND front_tool_compatible
      disabled:
      - condition: power < 50CV
        tooltip: Puissance minimum 50 CV pour le relevage avant
      - condition: no relevage avant installed
        tooltip: Installez d'abord un relevage avant
  chain:
  - step: backend_transaction
    sql:
    - UPDATE vehicle SET front_attached_to=$tool_id WHERE id=$tractor_id
  - step: frontend_toast
    message: 🔗 {tool} attelé à l'avant — combiné actif
  depends_on:
  - F127
  tests:
  - GIVEN tractor 100CV + relevage WHEN attach front THEN front_attached
  - GIVEN tractor 40CV THEN 400 puissance insuffisante
  requires:
  - vehicle:tractor
- id: F133
  name: Tarir une vache
  sprint: 7
  status: spec
  trigger:
    type: button
    label: Tarir (arrêt traite)
    page: /animals/:id
    states:
      active: is_lactating AND pregnant AND due_in < 14 days
      disabled:
      - condition: not lactating
        tooltip: Pas en lactation
      - condition: not pregnant
        tooltip: Pas gestante
      - condition: due_in > 14 days
        tooltip: Trop tôt (tarissement 2 mois avant mise bas)
  chain:
  - step: backend_transaction
    sql:
    - UPDATE animal SET is_lactating=false, is_dried_off=true
  - step: frontend_toast
    message: 🐄 {name} tarie — arrêt traite jusqu'à la mise bas
  depends_on:
  - F023
  tests:
  - GIVEN lactating pregnant due in 10d WHEN dry off THEN is_dried_off=true
  - GIVEN not pregnant THEN 400
  requires:
  - animal:vache_laitiere
- id: F134
  name: Retourner le lin (séchage)
  sprint: 11
  status: spec
  trigger:
    type: button
    label: Retourner le lin
    page: /parcels/:id
    states:
      active: crop.type='lin' AND crop.status='harvested_phase1' AND has_retourneuse AND ht_ok
      disabled:
      - condition: not lin
        tooltip: Réservé au lin
      - condition: wrong phase
        tooltip: Le lin doit d'abord être arraché
      - condition: no retourneuse
        tooltip: Retourneuse requise
  chain:
  - step: generate_idempotency_key
  - step: backend_transaction
    sql:
    - UPDATE crop SET status='drying'
    - UPDATE player ht, vehicle wear, inventory hvc
  - step: frontend_toast
    message: 🌿 Lin retourné — séchage en cours (2 mois)
  depends_on:
  - F041
  tests:
  - GIVEN lin harvested_phase1, retourneuse WHEN turn THEN status=drying
  requires:
  - parcel
  - vehicle:tractor
  - vehicle:retourneuse_lin
  - fuel:hvc
- id: F135
  name: Achat matériel en commun (CUMA)
  sprint: 15
  status: spec
  trigger:
    type: button
    label: Proposer achat commun
    page: /equipment/shop
    states:
      active: has_friends_same_region AND vehicle_selected
      disabled:
      - condition: no friends in region
        tooltip: Vous devez avoir des amis dans votre région
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/vehicles/cuma
    body: '{ vehicle_type_id, friend_ids: uuid[], my_share_pct: number }'
  - step: backend_transaction
    sql:
    - CHECK all friends in same region, max 5 participants
    - INSERT shared_vehicle (owner_ids, shares, usage_hours_per_player)
    - Debit each player proportionally
  - step: frontend_toast
    message: 🤝 Achat commun proposé — en attente de validation des {count} participants
  depends_on:
  - F043
  - F094
  tests:
  - GIVEN 3 friends same region WHEN propose THEN pending validation
  - GIVEN friend different region THEN 400
  requires: []
- id: F136
  name: Négocier prix matériel occasion
  sprint: 15
  status: spec
  trigger:
    type: button
    label: Proposer {prix} €
    page: /equipment/market/:id
    states:
      active: listing_active AND NOT own_listing
      disabled:
      - condition: own listing
        tooltip: Vous ne pouvez pas négocier votre propre annonce
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/vehicles/negotiate
    body: '{ listing_id, proposed_price: number }'
  - step: backend_transaction
    sql:
    - INSERT INTO negotiation (listing_id, buyer_id, proposed_price, status='pending')
    - Notify seller via WS
  - step: frontend_toast
    message: 💬 Offre de {prix}€ envoyée au vendeur
  depends_on:
  - F064
  tests:
  - GIVEN listing active WHEN negotiate THEN offer sent
  - GIVEN own listing THEN 400
  requires: []
- id: F137
  name: Créer une CAR
  sprint: 13
  status: spec
  trigger:
    type: button
    label: Créer une coopérative
    page: /cooperatives/create
    states:
      active: NOT member_of_car AND balance >= 5000 AND ht >= 2.0
      disabled:
      - condition: already member
        tooltip: Quittez votre CAR actuelle d'abord
      - condition: balance < 5000
        tooltip: Capital minimum 5 000€ requis
  chain:
  - step: generate_idempotency_key
  - step: api_call
    method: POST
    route: /api/cooperatives
    body: '{ name: string, region_id: int }'
  - step: backend_transaction
    sql:
    - INSERT INTO cooperative (name, region_id, founder_id)
    - INSERT INTO coop_member (player_id, cooperative_id, role='president')
    - UPDATE player balance -= 5000, ht -= 2.0
    - INSERT ledger
  - step: frontend_toast
    message: 🤝 CAR "{name}" créée ! Vous en êtes le président.
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on: []
  tests:
  - GIVEN not member, 5000€ WHEN create THEN CAR created, player=president
  - GIVEN already member THEN 400
  requires: []
- id: F138
  name: Vermifuger un animal
  sprint: 5
  status: spec
  trigger:
    type: button
    label: Vermifuger {cost} €
    page: /animals/:id
    states:
      active: animal_owned AND NOT recently_dewormed AND balance >= cost AND ht >= 0.3
      disabled:
      - condition: recently dewormed
        tooltip: Déjà vermifugé (prochain dans {days}j)
      - condition: balance < cost
        tooltip: Solde insuffisant
  chain:
  - step: generate_idempotency_key
  - step: backend_transaction
    sql:
    - UPDATE animal SET last_dewormed_at=NOW()
    - UPDATE player balance -= cost, ht -= 0.3
    - INSERT INTO animal_health_log (type='deworm')
    - INSERT ledger
  - step: frontend_toast
    message: 💊 {name} vermifugé ! Protection 42j
  - step: frontend_animate_header
    fields:
    - balance
    - ht
  depends_on:
  - F004
  tests:
  - GIVEN animal not dewormed WHEN deworm THEN last_dewormed_at=NOW()
  - GIVEN recently dewormed THEN 400
  requires:
  - animal:any
