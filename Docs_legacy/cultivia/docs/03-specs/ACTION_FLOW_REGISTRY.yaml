  name: Tick mensuel économique
  sprint: 9
  status: spec
  trigger:
    type: worker_tick
    step: 16
    condition: 1er du mois Cultivia (chaque lundi)
  chain:
  - step: worker_process_salaries
    sql: 'For each employee: IF player.balance >= salary THEN debit salary ELSE fire employee + notification'
  - step: worker_process_loan_payments
    sql: 'For each active loan: monthly_principal = principal/duration, monthly_interest = remaining × rate/12, debit total.
      IF insufficient funds: notification impayé'
  - step: worker_process_energy
    sql: 'For each player: total_kwh = SUM(building.energy_monthly × season_factor), cost = total_kwh × 0.08, debit cost'
  - step: worker_process_building_wear
    sql: 'For each building: UPDATE building SET wear_pct = LEAST(100, wear_pct + 0.5)'
  - step: worker_process_taxes
    sql: 'For each player: tax = progressive_tax(total_ha), msa = monthly_revenue × 0.05, debit tax + msa'
